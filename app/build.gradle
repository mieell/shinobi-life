plugins {
    id 'com.android.application' version '8.12.0'
}

android {
    namespace 'com.shinobilife.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shinobilife.game'
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName '0.8.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
